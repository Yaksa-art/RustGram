[package]
name = "tl-codegen"
version = "0.1.0"
edition = "2021"
description = "Rust port of lib_tl/tl/generate_tl.py: TL scheme -> C++ (byte-identical). Phase 1."
license = "GPL-3.0-or-later"

[[bin]]
name = "tl-codegen"
path = "src/bin/tl-codegen.rs"

[dependencies]
regex = "1"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
