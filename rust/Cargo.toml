# RustGram Rust workspace.
#
# All Rust code in this repository lives here. Per ADR-0001
# (docs/adr/ADR-0001-single-rust-bridge.md) only rustgram-bridge
# exposes symbols to the C++ side; everything else is a pure-Rust
# dependency of that crate.

[workspace]
resolver = "2"
members = ["crates/rustgram-bridge", "crates/tl-codegen", "xtask-rust-loc"]
